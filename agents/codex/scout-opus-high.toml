name = "scout-opus-high"
description = "Read-only analyst for judging inside the sub-agent — root-cause analysis, a security sweep, reviewing a diff for defects, verifying subtle behaviour from the code. Never edits. On Codex: GPT-5.6 Sol at high effort, read-only sandbox."
model = "gpt-5.6-sol"
